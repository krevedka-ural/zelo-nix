[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "zelo"
version = "0.2.0"
description = "Zelotes F-36 mouse control for Linux (RGB panel, memory dump, ...)"
requires-python = ">=3.9"

[project.scripts]
zelo = "zelo.cli:main"

[tool.setuptools]
packages = ["zelo"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "zelo"
version = "0.3.0"
description = "Zelotes F-36 mouse control for Linux (RGB panel, memory dump, ...)"
requires-python = ">=3.9"

[project.optional-dependencies]
gui = ["PySide6"]

[project.scripts]
zelo = "zelo.cli:main"

[project.gui-scripts]
zelo-gui = "zelo.gui:main"

[tool.setuptools]
packages = ["zelo"]
